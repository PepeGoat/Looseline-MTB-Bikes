<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Looseline MTB · Mission Control</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <style>
    html, body, #root { margin: 0; padding: 0; height: 100%; background: #f4efe6; }
    * { box-sizing: border-box; }
    input { font-family: inherit; color: inherit; }
    button { -webkit-tap-highlight-color: transparent; }
  </style>

  <script>
    window.addEventListener('error', (e) => {
      if (e && e.message && /ResizeObserver loop/.test(e.message)) {
        e.stopImmediatePropagation();
        e.preventDefault();
      }
    });
  </script>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script>
    (() => {
      const q = window.location.search;
      const files = [
        'shared.jsx',
        'mc/chrome.jsx',
        'mc/home.jsx',
        'mc/plp.jsx',
        'mc/pdp.jsx',
        'mc/config.jsx',
        'mc/cart.jsx',
        'mc/app.jsx',
      ];
      for (const f of files) {
        const s = document.createElement('script');
        s.type = 'text/babel';
        s.dataset.presets = 'react';
        s.src = f + q;
        document.head.appendChild(s);
      }
    })();
  </script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" data-presets="react">
    function Root() {
      const App = window.MC && window.MC.App;
      if (!App) return null;
      return (
        <window.LightCtx.Provider value={true}>
          <App />
        </window.LightCtx.Provider>
      );
    }
    function mount() {
      if (window.MC && window.MC.App) {
        ReactDOM.createRoot(document.getElementById('root')).render(<Root />);
      } else {
        setTimeout(mount, 30);
      }
    }
    mount();
  </script>
</body>
</html>
